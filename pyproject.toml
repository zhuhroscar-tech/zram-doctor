[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zram-doctor"
version = "0.2.12"
description = "Detects drift between zram-generator.conf and the actually-running zram device(s)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhuhroscar-tech" }]
requires-python = ">=3.9"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/zram-doctor"

[project.scripts]
zram-doctor = "zram_doctor.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
