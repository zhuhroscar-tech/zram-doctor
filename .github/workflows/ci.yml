name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -v
      - name: Set up a real zram device + config on this Linux runner
        run: |
          sudo modprobe zram || true
          sudo mkdir -p /etc/systemd/zram-generator.conf.d
          printf '[zram0]\ncompression-algorithm = zstd\n' | sudo tee /etc/systemd/zram-generator.conf >/dev/null
          sudo zramctl --find --size 64M --algorithm zstd || true
          zramctl || true
      - name: Smoke-test installed console script against real runner state
        run: |
          zram-doctor --version
          zram-doctor --help
          zram-doctor --json > /tmp/zd.json || true
          python -m json.tool < /tmp/zd.json > /dev/null
          # zram-doctor's own exit code (0/1/2) reflects diagnostic findings,
          # not a smoke-test failure -- GH Actions runners may lack zram
          # kernel module support, which is a legitimate "device missing"
          # finding, not a bug. Only fail this step if the command itself
          # cannot run (exit code >2 would indicate a crash).
          set +e
          zram-doctor
          rc=$?
          set -e
          echo "zram-doctor exit code: $rc"
          if [ "$rc" -gt 2 ]; then
            echo "Unexpected exit code $rc (expected 0/1/2)"
            exit 1
          fi

  build-artifact:
    name: build wheel + sdist + pyz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build standalone .pyz (zipapp)
        run: |
          python -m pip install --target build/pyz-deps .
          printf 'from zram_doctor.cli import main\nif __name__ == "__main__":\n    raise SystemExit(main())\n' > build/pyz-deps/__main__.py
          python -m zipapp build/pyz-deps -o dist/zram-doctor.pyz -p "/usr/bin/env python3"
      - name: Smoke-test the .pyz on this Linux runner
        run: |
          python3 dist/zram-doctor.pyz --version
          python3 dist/zram-doctor.pyz --json > /tmp/zd.json || true
          python3 -m json.tool < /tmp/zd.json > /dev/null
          # Regression check: the .pyz's exit code must reflect the real
          # command result, not always be 0 (zipapp's --main template
          # omits sys.exit(), which previously made every .pyz invocation
          # report success regardless of actual findings/errors). An
          # unrecognized flag is a deterministic nonzero (argparse error) case.
          set +e
          python3 dist/zram-doctor.pyz --bogus-flag-xyz > /dev/null 2>&1
          bogus_code=$?
          set -e
          test "$bogus_code" -ne 0
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
