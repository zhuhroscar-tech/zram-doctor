name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -v
      - name: Set up a real zram device + config on this Linux runner
        run: |
          sudo modprobe zram || true
          sudo mkdir -p /etc/systemd/zram-generator.conf.d
          printf '[zram0]\ncompression-algorithm = zstd\n' | sudo tee /etc/systemd/zram-generator.conf >/dev/null
          sudo zramctl --find --size 64M --algorithm zstd || true
          zramctl || true
      - name: Smoke-test installed console script against real runner state
        run: |
          zram-doctor --version
          zram-doctor --help
          zram-doctor --json | python -m json.tool > /dev/null
          zram-doctor; echo "exit code: $?"

  build-artifact:
    name: build wheel + sdist + pyz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build standalone .pyz (zipapp)
        run: |
          python -m pip install --target build/pyz-deps .
          python -m zipapp build/pyz-deps -m "zram_doctor.cli:main" -o dist/zram-doctor.pyz -p "/usr/bin/env python3"
      - name: Smoke-test the .pyz on this Linux runner
        run: |
          python3 dist/zram-doctor.pyz --version
          python3 dist/zram-doctor.pyz --json | python3 -m json.tool > /dev/null
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
